name: Android CI

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

# GitHub's ubuntu runners ship the Android SDK (ANDROID_HOME preset), so AGP can
# resolve platforms/build-tools without extra setup. The committed Gradle wrapper
# (incl. gradle-wrapper.jar) is required for ./gradlew to run here.
jobs:
  build:
    name: Assemble & check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble, lint & unit test
        run: ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/**/build/reports/**
          if-no-files-found: ignore
